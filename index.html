<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bhasini — Voice Intelligence in Every Indian Language. Deploy production-grade voice agents in Hindi, English, Tamil, Telugu, Marathi, Punjabi and more." />
    <title>Bhasini | Voice Intelligence. In Every Indian Language.</title>
    <style>
      /* Critical inline CSS to prevent FOUC (Flash of Unstyled Content) */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #F7F5F2;
        color: #0D0D0D;
      }
      #root {
        background-color: #F7F5F2;
      }
      /* Hide root until React hydrates to prevent flash */
      #root:empty {
        background-color: #F7F5F2;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
